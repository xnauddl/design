name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 ref에서 새 푸시가 오면 진행 중인 실행을 취소(중복 빌드 방지).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test`는 build 후 node --test 실행(package.json test 스크립트).
      - name: Build & Test
        run: npm test

      # 문자열 테이블 ↔ 마크업 정합. 위 빌드 산출물을 그대로 쓴다(재빌드 없음).
      # 브라우저를 안 쓰므로 playwright 설치가 필요 없다.
      - name: Verify i18n
        run: node scripts/verify-i18n.mjs
