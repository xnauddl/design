name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 ref에서 새 푸시가 오면 진행 중인 실행을 취소(중복 빌드 방지).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test`는 build 후 node --test 실행(package.json test 스크립트).
      - name: Build & Test
        run: npm test

      # 문자열 테이블 ↔ 마크업 정합. 위 빌드 산출물을 그대로 쓴다(재빌드 없음).
      # 브라우저를 안 쓰므로 playwright 설치가 필요 없다.
      - name: Verify i18n
        run: node scripts/verify-i18n.mjs

      # 연결·변수 탭 상태 흐름 회귀 검사(헤드리스 Chromium). 위 빌드 산출물(dist/ui.html)을 그대로 쓴다.
      # 브라우저는 package-lock의 playwright 버전에 맞춰 설치한다(--with-deps: OS 라이브러리·글꼴 포함).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify bind flow
        run: node scripts/verify-bind-flow.mjs
